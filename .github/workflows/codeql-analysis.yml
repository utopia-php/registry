name: "CodeQL"

on: [pull_request]
jobs:
  lint:
    name: CodeQL
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2

    - run: git checkout HEAD^2

    - name: Run CodeQL
      run: |
        docker run --rm -v "$PWD:/app" composer:2.7.9@sha256:cb3483dc851665462a66c59982577dfbbde0ae2059e8b5550c2f49f44b8c333e sh -c \
        "composer install --profile --ignore-platform-reqs && composer check"
